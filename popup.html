<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; }
    body { width: 300px; margin: 0; padding: 16px; background: var(--bg); color: var(--text); font-family: sans-serif; }
    h2 { font-size: 14px; margin: 0 0 16px; color: var(--accent); text-align: center; letter-spacing: 1px; text-transform: uppercase; }
    .section { background: var(--card); padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #334155; }
    .label-small { font-size: 11px; color: #94a3b8; margin-bottom: 8px; display: block; text-transform: uppercase; font-weight: bold; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .controls { display: flex; align-items: center; gap: 10px; }
    label { font-size: 13px; font-weight: 500; }
    
    select { background: #334155; color: white; border: 1px solid #475569; border-radius: 6px; padding: 6px; width: 100%; cursor: pointer; outline: none; font-size: 13px; }
    select:focus { border-color: var(--accent); }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; margin: 0; }
    input[type="color"] { border: none; width: 24px; height: 24px; padding: 0; background: none; cursor: pointer; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid #334155; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Auto translation</h2>
  
  <div class="section">
    <span class="label-small">Target Language</span>
    <select id="targetLang"></select>
  </div>

  <div class="section">
    <span class="label-small">Twitter (X.com)</span>
    <div class="row">
      <label>Enable Translation</label>
      <div class="controls">
        <input type="color" id="colorX">
        <input type="checkbox" id="enableX">
      </div>
    </div>
  </div>

  <div class="section">
    <span class="label-small">YouTube</span>
    <div class="row">
      <label>Enable Translation</label>
      <div class="controls">
        <input type="color" id="colorYT">
        <input type="checkbox" id="enableYT">
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
